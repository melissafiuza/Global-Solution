    <section id="form">    
<div class="container">
    <div class="form-card">
      <div class="form-header">
        <span class="badge"><h1>✉ Fale Conosco</h1></span>
      </div>

      <form class="form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Nome completo</label>
            <input type="text" id="name" placeholder="Seu nome" required>
          </div>
          <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seu@email.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="subject">Assunto</label>
          <select id="subject" required>
            <option value="" disabled selected>Selecione um assunto</option>
            <option value="duvida">Dúvida geral</option>
            <option value="tecnico">Suporte técnico</option>
            <option value="planos">Planos e pagamentos</option>
            <option value="parceria">Parcerias</option>
            <option value="outro">Outro</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">Mensagem</label>
          <textarea id="message" rows="5" placeholder="Descreva sua dúvida ou solicitação..." required></textarea>
        </div>

        <button type="submit" class="btn-submit">Enviar mensagem</button>
      </form>

      <div class="form-footer">
        <p>Ou entre em contato por <a href="mailto:suporte@integramais.com.br">suporte@integramais.com.br</a></p>
      </div>
    </div>
  </div>
  </section>
